<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauti, offline voice notes</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff3b33'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
    <aside class="rail">
        <div class="brand">
            <strong>Sauti</strong>
            <span class="tag">offline voice notes</span>
        </div>

        <form id="searchForm" class="seek">
            <input id="q" type="search" placeholder="Search your notes" autocomplete="off">
            <kbd class="hint">/</kbd>
            <button type="submit" class="ask">Ask</button>
        </form>
        <div class="chips" id="chips" hidden></div>
        <div id="results" class="hits" hidden></div>

        <div class="rail-head">
            <span>Notes</span>
            <span id="noteCount">0</span>
        </div>
        <div id="notesList" class="stack"></div>
    </aside>

    <main class="stage" id="stage">
        <section id="idle" class="idle">
            <p class="kicker">Cloud to Pocket</p>
            <h1>Talk. Get notes.</h1>
            <p class="lede">Yap instead of type. Sauti transcribes and structures the note on this machine. No cloud, no typing required.</p>
            <p class="keys"><kbd>R</kbd> record &nbsp;·&nbsp; pause anytime &nbsp;·&nbsp; <kbd>/</kbd> search</p>
        </section>

        <article id="detail" class="detail" hidden>
            <div class="detail-bar">
                <button id="back" class="text-btn" type="button">Back</button>
                <div class="bar-right">
                    <span id="saveState" class="save-state"></span>
                    <button id="dCopy" class="text-btn view-only" type="button">Copy</button>
                    <button id="dRebuild" class="text-btn view-only" type="button">Rewrite notes</button>
                    <button id="dEdit" class="text-btn view-only" type="button">Fix transcript</button>
                    <button id="dCancel" class="text-btn edit-only" type="button" hidden>Cancel</button>
                    <button id="dSave" class="text-btn edit-only" type="button" hidden>Save</button>
                    <button id="dDelete" class="text-btn danger view-only" type="button">Delete</button>
                </div>
            </div>
            <h2 id="dTitle"></h2>
            <p id="dWhen" class="when"></p>
            <div class="playpill">
                <button id="playBtn" type="button" aria-label="Play">▶</button>
                <span id="playCur">0:00</span>
                <input id="playSeek" type="range" min="0" max="0" value="0" step="0.1">
                <span id="playDur">0:00</span>
            </div>
            <audio id="dAudio"></audio>
            <div id="dBody" class="body"></div>
            <section id="sumSection">
                <h3>Summary</h3>
                <p id="dSummary" class="summary"></p>
            </section>
            <textarea id="eTranscript" class="transcript edit-only" rows="8" placeholder="Fix the transcript…"></textarea>
        </article>
    </main>
</div>

<div class="recbar" id="recbar">
    <canvas id="wave" class="wave" width="160" height="36"></canvas>
    <button id="rec" class="rec" type="button" title="Record (R)">
        <span class="dot"></span>
        <span id="recLabel">Record</span>
    </button>
    <button id="recPause" class="cancel" type="button" hidden>Pause</button>
    <button id="recCancel" class="cancel" type="button" hidden title="Cancel (Esc)">Cancel</button>
    <label class="upload" for="file">Upload</label>
    <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm" hidden>
    <div class="menu" id="langMenu">
        <button type="button" class="menu-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langList" title="Language">
            <span id="langLabel">EN</span>
            <span class="chev" aria-hidden="true"></span>
        </button>
        <ul class="menu-list" id="langList" role="listbox" hidden>
            <li role="none"><button type="button" role="option" data-value="en" aria-selected="true">English</button></li>
            <li role="none"><button type="button" role="option" data-value="sw" aria-selected="false">Kiswahili</button></li>
        </ul>
        <input type="hidden" id="lang" value="en">
    </div>
</div>

<div id="progress" class="progress" hidden>
    <div class="bar"><div id="barFill"></div></div>
    <div id="stageLabel">…</div>
</div>

<script src="/app.js"></script>
</body>
</html>
