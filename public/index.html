<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sauti — offline voice notes</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ba68c8'/%3E%3C/svg%3E">
</head>
<body>
<header>
    <div class="brand"><span class="logo">●</span> Sauti <span class="sub">— offline voice notes</span></div>
    <div id="net" class="net">checking…</div>
</header>

<main>
    <section id="capture" class="card">
        <h2>New note</h2>
        <div class="rec-controls">
            <button id="rec" class="rec">🎙 Record</button>
            <span id="recState" class="rec-state"></span>
        </div>
        <div class="upload">
            <label for="file">or open an audio file</label>
            <input id="file" type="file" accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm">
        </div>
        <label class="lang">Language
            <select id="lang">
                <option value="en">English</option>
                <option value="sw">Kiswahili</option>
            </select>
        </label>
        <div id="progress" class="progress hidden">
            <div class="bar"><div id="barFill"></div></div>
            <div id="stage">…</div>
        </div>
    </section>

    <section id="notesPane" class="card">
        <h2>Notes</h2>
        <div id="notesList" class="notes-list"></div>
    </section>

    <section id="searchPane" class="card">
        <h2>Search <span class="hint">semantic, on-device</span></h2>
        <form id="searchForm">
            <input id="q" type="text" placeholder="e.g. who is demoing? deadlines?" autocomplete="off">
            <button type="submit">Search</button>
        </form>
        <div id="results"></div>
    </section>
</main>

<div id="modal" class="modal hidden">
    <div class="modal-card">
        <button id="closeModal" class="x">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="/app.js"></script>
</body>
</html>
